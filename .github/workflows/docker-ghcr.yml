name: Build & Push Docker image (GHCR)

on:
  push:
    branches: ["main", "develop"]
    tags: ["beta-v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q qui_ratio_dashboard tests

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repo owner (lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/qui-ratio-dashboard:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/qui-ratio-dashboard:latest', steps.repo.outputs.owner) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('ghcr.io/{0}/qui-ratio-dashboard:develop', steps.repo.outputs.owner) || '' }}
            ${{ github.ref == 'refs/heads/develop' && format('ghcr.io/{0}/qui-ratio-dashboard:beta-v0.1.6', steps.repo.outputs.owner) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/beta-v') && format('ghcr.io/{0}/qui-ratio-dashboard:{1}', steps.repo.outputs.owner, github.ref_name) || '' }}
